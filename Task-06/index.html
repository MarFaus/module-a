<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Task 06 - CSS Counter</title>
</head>
<body>
    <div class="counter-wrapper">
        <div class="boxes">
            <input type="checkbox" id="num1" class="box-check">
            <label for="num1" class="box-label">10</label>

            <input type="checkbox" id="num2" class="box-check">
            <label for="num2" class="box-label">32</label>

            <input type="checkbox" id="num3" class="box-check">
            <label for="num3" class="box-label">64</label>

            <input type="checkbox" id="num4" class="box-check">
            <label for="num4" class="box-label">-15</label>
        </div>
        <div class="result">Сумма: <span class="total"></span></div>
    </div>
</body>
</html>
